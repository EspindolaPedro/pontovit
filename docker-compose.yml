services:
  postgres:
    image: postgres:16-alpine
    container_name: pontovit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pontovit
      POSTGRES_USER: pontovit
      POSTGRES_PASSWORD: pontovit_dev
      # Dev local apenas: Docker Desktop (pós-reinstalação) encaminha as conexões do
      # Windows via o gateway da rede bridge (ex.: 172.18.0.1), não como 127.0.0.1
      # puro — o pg_hba.conf padrão do Postgres só confia em loopback exato e
      # rejeitava a conexão. "trust" aqui é seguro: é só o banco local de dev.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - pontovit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontovit -d pontovit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pontovit_postgres_data:
